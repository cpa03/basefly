name: e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "apps/nextjs/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04
    # Only run when the secrets required to boot the application are configured.
    # On forks or repositories without E2E credentials the job is skipped
    # instead of failing, keeping CI green for unrelated changes.
    if: ${{ secrets.CLERK_SECRET_KEY != '' && secrets.STRIPE_API_KEY != '' && secrets.POSTGRES_URL != '' }}
    timeout-minutes: 30

    env:
      E2E_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Start dev server
        run: |
          pnpm dev:web > /tmp/dev-server.log 2>&1 &
          echo "Waiting for dev server on http://localhost:3000 ..."
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000; then
              echo "Dev server is ready."
              exit 0
            fi
            sleep 5
          done
          echo "Dev server failed to start within 300s. Log tail:"
          tail -50 /tmp/dev-server.log
          exit 1

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7